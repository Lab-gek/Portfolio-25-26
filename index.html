<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thijmen van Groenestijn — Over mij</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="topbar">
    <a class="logo" href="index.html">Thijmen van Groenestijn</a>
    <div class="nav-links">
      <a href="index.html" class="active">Over mij</a>
      <a href="opdrachten.html">Opdrachten &amp; projecten</a>
      <a href="skills.html">Skills</a>
      <a href="fotografie.html">Fotografie</a>
      <a href="pop.html">POP</a>
    </div>
  </nav>

  <!-- HERO — gevuld vanuit overMij in data.js -->
  <section class="hero" aria-label="Introductie" id="render-hero"></section>

  <!-- QUICK FACTS — gevuld vanuit overMij.quickFacts in data.js -->
  <div class="quick-facts" aria-label="Snelle feiten" id="render-quickfacts"></div>

  <!-- WIE BEN IK — gevuld vanuit overMij.bio in data.js -->
  <div style="padding: 0 28px; max-width: 720px; margin-bottom: 40px;">
    <p class="page-eyebrow" style="margin-bottom: 8px;">Wie ben ik?</p>
    <div id="render-bio"></div>
  </div>

  <!-- HOBBIES — gevuld vanuit de hobbies array in data.js -->
  <h2 class="section-title">Hobbies &amp; interesses</h2>
  <div class="hobbies-grid" id="render-hobbies"></div>

  <!-- FOTO TEASER — gevuld vanuit de fotoTeaser array in data.js -->
  <h2 class="section-title">Eigen foto's</h2>
  <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 0 28px 60px;"
       id="render-fototeaser"></div>

  <footer>
    <p id="render-footer"></p>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
  <script>
    // Render alle secties vanuit data.js
    renderHero();
    renderQuickFacts();
    renderBio();
    renderHobbies();
    renderFotoTeaser();
    document.getElementById('render-footer').textContent = siteConfig.footerTekst;
  </script>
</body>
</html>
