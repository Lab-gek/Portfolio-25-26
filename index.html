<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio — Over mij</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="topbar">
    <a href="index.html" class="logo">Portfolio</a>
    <div class="nav-links">
      <a href="index.html">Over mij</a>
      <a href="opdrachten.html">Opdrachten & projecten</a>
      <a href="skills.html">Skills</a>
      <a href="fotografie.html">Fotografie</a>
      <a href="pop.html">POP</a>
    </div>
  </nav>

  <!-- Hero — gevuld vanuit data.js → about -->
  <section class="hero">
    <div id="hero-photo-wrap"></div>
    <div class="hero-text">
      <div class="hero-greeting">Welkom op mijn portfolio</div>
      <h1 class="hero-name" id="hero-name"></h1>
      <p class="hero-tagline" id="hero-tagline"></p>
      <div class="hero-tags">
        <span class="badge badge-personal">Persoonlijk</span>
        <span class="badge badge-school">School</span>
      </div>
    </div>
  </section>

  <hr class="section-divider">

  <!-- Quick facts — gevuld vanuit data.js → about.quickFacts -->
  <div class="about-strip">
    <div class="strip-label">Snel over mij</div>
    <div class="quick-facts" id="quick-facts"></div>
  </div>

  <!-- Citaat — gevuld vanuit data.js → about.quote -->
  <p class="hero-quote" id="hero-quote"></p>

  <!-- Wie ben ik? — gevuld vanuit data.js → about.aboutText -->
  <div class="about-strip">
    <div class="strip-label">Wie ben ik?</div>
    <div id="about-text" style="font-size: 15px; color: var(--text); line-height: 1.75;"></div>
  </div>

  <!-- Hobbies — gevuld vanuit data.js → about.hobbies -->
  <div class="about-strip">
    <div class="strip-label">Hobbies & interesses</div>
    <div class="hobbies-grid" id="hobbies-grid"></div>
  </div>

  <hr class="section-divider">

  <!-- Foto teaser — gevuld vanuit data.js → about.photoTeaser -->
  <div class="photo-teaser">
    <div class="strip-label">Eigen foto's</div>
    <div class="teaser-grid" id="photo-teaser"></div>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
